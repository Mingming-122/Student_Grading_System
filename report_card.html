<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Report Card</title>
  <style>
    /* ---- Plain, minimal styling ---- */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      background: #ffffff;
      color: #111111;
      padding: 30px 40px;
      max-width: 760px;
      margin: 0 auto;
    }

    h1 { font-size: 18px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
    h2 { font-size: 13px; font-weight: normal; margin-bottom: 20px; color: #444; }

    .divider { border: none; border-top: 1px solid #111; margin: 12px 0; }
    .divider-dbl { border-top: 3px double #111; }

    .meta-grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 16px; margin-bottom: 14px; }
    .meta-grid span:nth-child(odd) { font-weight: bold; }

    table { width: 100%; border-collapse: collapse; margin: 10px 0; }
    th { text-align: left; border-bottom: 1px solid #111; padding: 4px 6px; font-size: 13px; }
    td { padding: 4px 6px; font-size: 13px; }
    td.num, th.num { text-align: right; }
    tr:nth-child(even) { background: #f5f5f5; }

    .summary { margin-top: 16px; border-top: 1px solid #111; padding-top: 10px; }
    .summary-row { display: flex; justify-content: space-between; padding: 3px 6px; }
    .summary-row:last-child { font-weight: bold; font-size: 15px; padding-top: 8px; }

    .standing-box {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 24px;
      border: 2px solid #111;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .standing-PASSED  { border-color: #111; }
    .standing-HONORS  { border-color: #111; }
    .standing-FAILED  { border-color: #111; }

    .footer { margin-top: 30px; font-size: 11px; color: #888; border-top: 1px solid #ccc; padding-top: 10px; }

    /* Error / loading state */
    #error-msg { color: #c00; font-size: 13px; margin-top: 20px; white-space: pre-wrap; }
    #instructions { font-size: 12px; color: #555; margin-top: 10px; line-height: 1.6; }
  </style>
</head>
<body>

  <!-- ======================================================
       Language 2: JavaScript (GUI / Report Card Dashboard)
       Responsibility:
         - Load report_data.json produced by the Python engine
         - Render the report card table and summary
         - Compute nothing — all data comes from Python output
  ====================================================== -->

  <h1>Student Grading &amp; GPA Report Card</h1>
  <h2>Generated by Python Computation Engine &mdash; Rendered by JavaScript Dashboard</h2>
  <hr class="divider divider-dbl" />

  <div id="report">Loading report data&hellip;</div>
  <div id="error-msg"></div>

  <script>
    "use strict";

    // -------------------------------------------------------
    // HELPER FUNCTIONS
    // -------------------------------------------------------

    /** Format a number to fixed decimal places. */
    function fmt(n, decimals = 2) {
      return Number(n).toFixed(decimals);
    }

    /** Return a human-readable label for the academic standing. */
    function standingLabel(standing) {
      const labels = {
        HONORS : "HONORS  (Latin Honors — GPA ≤ 1.75)",
        PASSED : "PASSED",
        FAILED : "FAILED",
      };
      return labels[standing] || standing;
    }

    // -------------------------------------------------------
    // DOM BUILDERS  (plain HTML strings — no frameworks)
    // -------------------------------------------------------

    function buildMetaSection(data) {
      return `
        <div class="meta-grid">
          <span>Student&nbsp;Name</span> <span>${escHtml(data.student_name)}</span>
          <span>School&nbsp;Year</span>  <span>${escHtml(data.school_year)}</span>
          <span>Semester</span>          <span>${escHtml(data.semester)}</span>
        </div>
        <hr class="divider" />
      `;
    }

    function buildSubjectsTable(subjects) {
      const rows = subjects.map((s, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${escHtml(s.name)}</td>
          <td class="num">${fmt(s.units, 1)}</td>
          <td class="num">${fmt(s.numeric_grade, 2)}</td>
          <td class="num">${fmt(s.gpa_point, 2)}</td>
          <td class="num">${s.letter_grade}</td>
          <td class="num">${fmt(s.quality_pts, 4)}</td>
        </tr>
      `).join("");

      return `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Subject</th>
              <th class="num">Units</th>
              <th class="num">Grade (0-100)</th>
              <th class="num">GPA Point</th>
              <th class="num">LG</th>
              <th class="num">Quality Pts</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function buildSummary(r) {
      return `
        <div class="summary">
          <div class="summary-row">
            <span>Total Units</span>
            <span>${fmt(r.total_units, 1)}</span>
          </div>
          <div class="summary-row">
            <span>Total Quality Points</span>
            <span>${fmt(r.total_quality_pts, 4)}</span>
          </div>
          <div class="summary-row">
            <span>Overall Weighted GPA</span>
            <span>${fmt(r.overall_gpa, 4)}</span>
          </div>
          <div class="summary-row">
            <span>Overall Letter Grade</span>
            <span>${r.overall_letter}</span>
          </div>
        </div>

        <div>
          <div class="standing-box standing-${r.standing}">
            ${standingLabel(r.standing)}
          </div>
        </div>
      `;
    }

    function buildGpaScaleReference() {
      const scale = [
        ["97 – 100", "1.00", "A+"],
        ["93 – 96",  "1.25", "A" ],
        ["89 – 92",  "1.50", "A-"],
        ["85 – 88",  "1.75", "B+"],
        ["81 – 84",  "2.00", "B" ],
        ["77 – 80",  "2.25", "B-"],
        ["73 – 76",  "2.50", "C+"],
        ["69 – 72",  "2.75", "C" ],
        ["65 – 68",  "3.00", "D" ],
        ["0  – 64",  "5.00", "F" ],
      ];
      const rows = scale.map(([range, gpa, letter]) =>
        `<tr><td>${range}</td><td class="num">${gpa}</td><td class="num">${letter}</td></tr>`
      ).join("");
      return `
        <hr class="divider" style="margin-top:30px"/>
        <p style="font-weight:bold; margin:10px 0 6px;">GPA Scale Reference</p>
        <table style="width:260px">
          <thead><tr><th>Numeric Range</th><th class="num">GPA Point</th><th class="num">Letter</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <p style="margin-top:8px; font-size:12px; color:#555">
          Honors: GPA &le; 1.75 &nbsp;|&nbsp; Passed: GPA &le; 3.00 &nbsp;|&nbsp; Failed: GPA &gt; 3.00 or any failing subject
        </p>
      `;
    }

    /** Escape HTML special characters to prevent injection. */
    function escHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // -------------------------------------------------------
    // MAIN RENDER FUNCTION
    // -------------------------------------------------------

    function renderReport(data) {
      const r   = data.results;
      const now = new Date().toLocaleString();

      const html = `
        ${buildMetaSection(data)}
        ${buildSubjectsTable(r.subjects)}
        ${buildSummary(r)}
        ${buildGpaScaleReference()}
        <div class="footer">
          Printed: ${now}
          &nbsp;&mdash;&nbsp;
          Computation Engine: Python &nbsp;|&nbsp; Dashboard: JavaScript
        </div>
      `;

      document.getElementById("report").innerHTML = html;
    }

    // -------------------------------------------------------
    // DATA LOADING  (fetch report_data.json from Python output)
    // -------------------------------------------------------

    fetch("report_data.json")
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        return response.json();
      })
      .then(data => {
        renderReport(data);
      })
      .catch(err => {
        document.getElementById("report").textContent = "";
        document.getElementById("error-msg").textContent =
          "Could not load report_data.json.\n\nError: " + err.message;

        document.getElementById("error-msg").insertAdjacentHTML("afterend", `
          <div id="instructions">
            <strong>How to generate the report:</strong><br/>
            1. Open a terminal in this folder.<br/>
            2. Run:  python grading_system.py<br/>
            3. Enter the student name, school year, semester, and subjects when prompted.<br/>
            4. After the Python script finishes, serve this folder with a local web server:<br/>
            &nbsp;&nbsp;&nbsp;python -m http.server 8000<br/>
            5. Open your browser and go to:  http://localhost:8000/report_card.html
          </div>
        `);
      });
  </script>

</body>
</html>
